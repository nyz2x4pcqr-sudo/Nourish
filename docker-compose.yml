services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_data
      # The backend serves the web app too. Read-only; the server only hands out a fixed list
      # of named files (index.html, app.js, icons...), never anything else in this folder.
      - .:/frontend:ro
    environment:
      FRONTEND_DIR: /frontend
      # Inside Docker, "localhost" is the container itself; reach LM Studio / Ollama on the PC.
      LMSTUDIO_URL: http://host.docker.internal:1234
      OLLAMA_URL: http://host.docker.internal:11434
    env_file:
      - path: ./backend/.env
        required: false
volumes:
  chroma_data:
