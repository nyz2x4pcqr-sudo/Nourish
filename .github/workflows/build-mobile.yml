name: Build phone apps

# Builds the Android APK and an unsigned iPhone IPA, then launches each in an emulator /
# simulator against a real Nourish server and saves screenshots (artifact "phone-screenshots").
on:
  push:
    branches: [main, "claude/**"]
    paths:
      # The phone apps display the web app from the server, so test them when either changes.
      - "mobile/**"
      - "backend/**"
      - "index.html"
      - "app.js"
      - "json-repair.js"
      - "grocery.js"
      - "units.js"
      - "recipes.js"
      - "importer.js"
      - "nutrition-data.js"
      - "nutrition.js"
      - "prefs.js"
      - "planner.js"
      - "sources.js"
      - "finder.js"
      - "library.js"
      - "books.js"
      - "foodlog.js"
      - "taste.js"
      - "builtins.js"
      - "theme.js"
      - "font-*.woff2"
      - "app-icon-*.png"
      - "font-*.woff2"
      - "icon-*.png"
      - "apple-touch-icon.png"
      - "ondevice.js"
      - "styles.css"
      - ".github/workflows/build-mobile.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_iphone_test:
        description: "Build the iPhone app but skip its ~70-minute simulator test (the push build on main still runs it)"
        type: boolean
        default: false

# Builds and tests only read the code; nothing here needs to change the repository.
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK (includes llama.cpp for arm64 and the x86_64 emulator)
        run: gradle -p mobile/android assembleDebug --no-daemon
      - name: Rename
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Nourish.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nourish-android
          path: Nourish.apk

  # Asks the real Hugging Face API for each phone profile's top 5, the same way the apps do.
  hf-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Live check - ask Hugging Face for each phone's top 5
        run: node mobile/ci/hf-live-check.js

  android-test:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Nourish-android
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start a Nourish server (logging every request)
        run: |
          pip install -r backend/requirements-core.txt
          cd backend && nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > "$GITHUB_WORKSPACE/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Get a tiny real model and the app's meal format
        run: |
          curl -sSfL -o test-model.gguf "https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf"
          node -e "require('fs').writeFileSync('meal.gbnf', require('./ondevice.js').mealGrammar(2))"
          ls -la test-model.gguf meal.gbnf
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run in the emulator
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: bash mobile/ci/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-screenshots-android
          path: |
            shots/
            server.log

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Recipe folder path tests (the /private/var case)
        working-directory: mobile/ios
        run: swiftc Nourish/LibraryPaths.swift Tests/main.swift -o "$RUNNER_TEMP/pathtests" && "$RUNNER_TEMP/pathtests"
      - name: Restore llama.cpp for iOS
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/ios/Frameworks
          key: llama-xcframework-${{ hashFiles('mobile/android/app/src/main/cpp/CMakeLists.txt', 'mobile/ci/prepare-ios.sh') }}
      - name: Copy the web app in and build llama.cpp
        run: bash mobile/ci/prepare-ios.sh
      # Saved straight away (not at the end of the job), so a later failure doesn't mean rebuilding it.
      - name: Save llama.cpp for iOS
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/ios/Frameworks
          key: llama-xcframework-${{ hashFiles('mobile/android/app/src/main/cpp/CMakeLists.txt', 'mobile/ci/prepare-ios.sh') }}
      - name: Generate the Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Build unsigned IPA
        working-directory: mobile/ios
        run: |
          xcodebuild -project Nourish.xcodeproj -target Nourish -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build -quiet
          mkdir -p Payload
          cp -R build/Release-iphoneos/Nourish.app Payload/
          # The recipe folders only show in the Files app if these two settings are in the built app.
          for key in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            [ "$(/usr/libexec/PlistBuddy -c "Print :$key" Payload/Nourish.app/Info.plist)" = "true" ] || { echo "Built app is missing $key"; exit 1; }
          done
          echo "Built app has file sharing on (Files → On My iPhone → Nourish)"
          zip -qry "$GITHUB_WORKSPACE/Nourish-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Nourish-ios
          path: Nourish-unsigned.ipa
      - name: Start a Nourish server (logging every request)
        run: |
          pip install -r backend/requirements-core.txt
          cd backend && nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > "$GITHUB_WORKSPACE/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Get a tiny real model
        run: curl -sSfL -o test-model.gguf "https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf"
      - name: Run in the simulator
        # Plans are made one meal at a time, and the tiny test model's recipes usually need all 3 tries.
        if: ${{ !inputs.skip_iphone_test }}
        timeout-minutes: 130
        working-directory: mobile/ios
        run: bash ../ci/ios-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-screenshots-ios
          path: |
            mobile/ios/shots/
            server.log
