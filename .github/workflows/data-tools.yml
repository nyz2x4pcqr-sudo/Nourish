name: Data tools

# Builds nutrition-data.js from USDA FoodData Central and checks the candidate recipe sites
# (robots.txt, terms, recipe data). Both need the internet. The results are pushed to the
# "data-tools-output" branch for review; nothing here changes main.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "usda, sources, plan, snapshot (real web recipes for the plan audit) or both (usda + sources)"
        default: both

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: USDA nutrition table
        if: inputs.what == 'usda' || inputs.what == 'both'
        run: python3 tools/usda-table.py > nutrition-data.js 2> usda-log.txt; cat usda-log.txt; wc -c nutrition-data.js
      - name: Check recipe sites
        if: inputs.what == 'sources' || inputs.what == 'both'
        run: node tools/sources-check.js > sources-report.txt; cat sources-report.txt
      - name: Real plans from the real sites (timing)
        if: inputs.what == 'plan'
        run: npm i --no-save linkedom@0.18 >/dev/null && node tools/plan-live.js > plan-live.txt 2>&1; cat plan-live.txt
      - name: Real web recipes for the plan audit (tools/plan-audit.js uses them offline)
        if: inputs.what == 'snapshot'
        run: npm i --no-save linkedom@0.18 >/dev/null && node tools/web-snapshot.js 5 > web-recipes.json; ls -l web-recipes.json
      - name: Push results to data-tools-output
        run: |
          mkdir -p /tmp/out && cp nutrition-data.js usda-log.txt sources-report.txt plan-live.txt web-recipes.json /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-tools-output
          git rm -rfq . && rm -rf ./*
          cp /tmp/out/* . 2>/dev/null || true
          git add -A && git commit -qm "Data tools output ($(date -u +%FT%TZ))" && git push -f origin data-tools-output
