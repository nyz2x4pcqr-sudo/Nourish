name: Build Windows app

# Builds Nourish.exe on a Windows machine.
# - Every push to main: the .exe is attached to the workflow run (Actions tab → run → "Nourish-windows").
# - Pushing a tag like v0.1.0-pre-alpha: the .exe is also published as a GitHub Release download.
#   Tags with a dash (-pre-alpha, -beta, ...) are marked as pre-releases.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "index.html"
      - "app.js"
      - "json-repair.js"
      - "styles.css"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write  # only used to publish a Release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (core only, no knowledge base)
        run: pip install -r backend/requirements-core.txt pyinstaller==6.22.3

      - name: Backend tests
        working-directory: backend
        run: python -m unittest -v main_test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend tests
        run: node --test

      - name: Build Nourish.exe
        run: >
          pyinstaller --noconfirm --onefile --console --name Nourish
          --collect-submodules uvicorn --paths backend
          --add-data "index.html;frontend" --add-data "app.js;frontend"
          --add-data "json-repair.js;frontend" --add-data "styles.css;frontend"
          backend/nourish_app.py

      - name: Smoke test the .exe
        shell: pwsh
        run: |
          $env:NOURISH_NO_BROWSER = "1"
          $env:NOURISH_PORT = "8010"
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item dist\Nourish.exe smoke\
          $p = Start-Process -FilePath smoke\Nourish.exe -WorkingDirectory smoke -PassThru `
               -RedirectStandardOutput smoke\out.txt -RedirectStandardError smoke\err.txt
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $health = Invoke-WebRequest http://localhost:8010/health -UseBasicParsing
              $page = Invoke-WebRequest http://localhost:8010/app.js -UseBasicParsing
              if ($health.StatusCode -eq 200 -and $page.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force
          Get-Content smoke\out.txt, smoke\err.txt -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "Nourish.exe did not start"; exit 1 }
          Write-Host "Nourish.exe started and served the app."

      - uses: actions/upload-artifact@v4
        with:
          name: Nourish-windows
          path: dist/Nourish.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        # Only attaches the .exe; a release written on GitHub keeps its own title and notes.
        with:
          files: dist/Nourish.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
