name: Build Windows app

# Builds Nourish.exe on Windows, runs the tests and smoke-tests the .exe.
# The result is attached to the workflow run (Actions tab → run → "Nourish-windows").
# Releases are made by release.yml, which calls this workflow.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "backend/**"
      - "index.html"
      - "app.js"
      - "json-repair.js"
      - "grocery.js"
      - "units.js"
      - "recipes.js"
      - "importer.js"
      - "nutrition-data.js"
      - "nutrition.js"
      - "prefs.js"
      - "planner.js"
      - "sources.js"
      - "finder.js"
      - "library.js"
      - "books.js"
      - "foodlog.js"
      - "taste.js"
      - "builtins.js"
      - "theme.js"
      - "font-*.woff2"
      - "app-icon-*.png"
      - "font-*.woff2"
      - "icon-*.png"
      - "apple-touch-icon.png"
      - "ondevice.js"
      - "styles.css"
      - "manifest.webmanifest"
      - "*.png"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (core only, no knowledge base)
        run: pip install -r backend/requirements-core.txt pyinstaller==6.22.3

      - name: Backend tests
        working-directory: backend
        run: python -m unittest -v main_test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend tests
        run: node --test

      - name: Build Nourish.exe
        run: >
          pyinstaller --noconfirm --onefile --console --name Nourish
          --collect-submodules uvicorn --paths backend
          --add-data "index.html;frontend" --add-data "app.js;frontend"
          --add-data "json-repair.js;frontend" --add-data "grocery.js;frontend" --add-data "units.js;frontend" --add-data "recipes.js;frontend" --add-data "importer.js;frontend" --add-data "nutrition-data.js;frontend" --add-data "nutrition.js;frontend" --add-data "prefs.js;frontend" --add-data "planner.js;frontend" --add-data "sources.js;frontend" --add-data "finder.js;frontend" --add-data "library.js;frontend" --add-data "books.js;frontend" --add-data "foodlog.js;frontend" --add-data "taste.js;frontend" --add-data "builtins.js;frontend" --add-data "theme.js;frontend" --add-data "font-inter.woff2;frontend" --add-data "font-source-serif.woff2;frontend" --add-data "font-source-sans.woff2;frontend" --add-data "font-nunito.woff2;frontend" --add-data "font-manrope.woff2;frontend" --add-data "app-icon-default.png;frontend" --add-data "app-icon-midnight.png;frontend" --add-data "app-icon-forest.png;frontend" --add-data "app-icon-plum.png;frontend" --add-data "app-icon-paper.png;frontend" --add-data "app-icon-oled.png;frontend" --add-data "font-fraunces.woff2;frontend" --add-data "font-figtree.woff2;frontend" --add-data "ondevice.js;frontend" --add-data "styles.css;frontend"
          --add-data "manifest.webmanifest;frontend" --add-data "icon-192.png;frontend"
          --add-data "icon-512.png;frontend" --add-data "apple-touch-icon.png;frontend"
          backend/nourish_app.py

      - name: Smoke test the .exe
        shell: pwsh
        run: |
          $env:NOURISH_NO_BROWSER = "1"
          $env:NOURISH_PORT = "8010"
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item dist\Nourish.exe smoke\
          $p = Start-Process -FilePath smoke\Nourish.exe -WorkingDirectory smoke -PassThru `
               -RedirectStandardOutput smoke\out.txt -RedirectStandardError smoke\err.txt
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $health = Invoke-WebRequest http://localhost:8010/health -UseBasicParsing
              $page = Invoke-WebRequest http://localhost:8010/app.js -UseBasicParsing
              $icon = Invoke-WebRequest http://localhost:8010/icon-192.png -UseBasicParsing
              if ($health.StatusCode -eq 200 -and $page.StatusCode -eq 200 -and $icon.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force
          Get-Content smoke\out.txt, smoke\err.txt -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "Nourish.exe did not start"; exit 1 }
          Write-Host "Nourish.exe started and served the app."

      - uses: actions/upload-artifact@v4
        with:
          name: Nourish-windows
          path: dist/Nourish.exe
