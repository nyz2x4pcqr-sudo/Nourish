<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14110F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nourish" />
    <title>Nourish - AI Meal Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="offline-banner" id="offlineBanner" role="status" hidden></div>
    <div class="job-bar" id="jobBar" role="status" aria-live="polite" hidden></div>

    <!-- App Container -->
    <div class="app-container">
        <!-- Today Screen -->
        <div class="screen screen-today active" id="screenToday">
            <div class="screen-header">
                <h1 class="large-title" id="todayTitle">Today</h1>
                <button type="button" class="btn-header" id="newPlanHeaderBtn" data-action="new-plan" hidden>New plan</button>
            </div>

            <!-- Day Strip (buttons are built from the plan) -->
            <div class="day-strip" id="dayStrip" hidden></div>

            <!-- Calorie Ring & Macros -->
            <div class="calorie-section" id="calorieSection" hidden>
                <div class="calorie-ring-container">
                    <svg class="calorie-ring" viewBox="0 0 180 180" width="180" height="180" aria-hidden="true">
                        <circle cx="90" cy="90" r="70" fill="none" stroke="var(--border)" stroke-width="12" stroke-linecap="round" />
                        <circle id="calorieProgress" cx="90" cy="90" r="70" fill="none" stroke="var(--accent)" stroke-width="12"
                                stroke-linecap="round" stroke-dasharray="0 439.82" transform="rotate(-90 90 90)" />
                    </svg>
                    <div class="calorie-ring-center">
                        <div class="calorie-value" id="calorieValue">—</div>
                        <div class="calorie-label" id="calorieLabel">calories this day</div>
                    </div>
                </div>

                <div class="macro-bars">
                    <div class="macro-bar">
                        <div class="macro-label">Protein</div>
                        <div class="macro-track"><div class="macro-fill macro-protein"></div></div>
                        <div class="macro-value" id="proteinValue">—</div>
                    </div>
                    <div class="macro-bar">
                        <div class="macro-label">Carbs</div>
                        <div class="macro-track"><div class="macro-fill macro-carbs"></div></div>
                        <div class="macro-value" id="carbsValue">—</div>
                    </div>
                    <div class="macro-bar">
                        <div class="macro-label">Fat</div>
                        <div class="macro-track"><div class="macro-fill macro-fat"></div></div>
                        <div class="macro-value" id="fatValue">—</div>
                    </div>
                </div>
            </div>

            <!-- Meal Cards (built from the plan) -->
            <div class="meal-cards" id="mealCards" hidden></div>

            <!-- Shown when no plan exists -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">📋</div>
                <div class="title">No meal plan yet</div>
                <div class="text-dim empty-text">Generate a personalized 7-day plan</div>
                <button type="button" class="btn btn-primary" data-action="new-plan">Generate Meal Plan</button>
            </div>
        </div>

        <!-- Plan Screen -->
        <div class="screen screen-plan" id="screenPlan">
            <div class="screen-header">
                <h1 class="large-title">Plan</h1>
            </div>
            <div class="accordions" id="planAccordions"></div>
        </div>

        <!-- Chat Screen -->
        <div class="screen screen-chat" id="screenChat">
            <div class="screen-header">
                <h1 class="large-title">Chat</h1>
                <button type="button" class="btn-header" id="chatPlanBtn">Make plan</button>
            </div>
            <div class="chat-messages" id="chatMessages" aria-live="polite"></div>
            <form class="chat-composer" id="chatForm">
                <textarea id="chatInput" rows="1" placeholder="Ask the chef…" enterkeyhint="send" aria-label="Message"></textarea>
                <button type="submit" class="chat-send" id="chatSend" aria-label="Send">↑</button>
            </form>
        </div>

        <!-- Grocery Screen -->
        <div class="screen screen-grocery" id="screenGrocery">
            <div class="screen-header">
                <h1 class="large-title">Grocery</h1>
            </div>
            <div id="groceryContainer"></div>
        </div>

        <!-- Settings Screen -->
        <div class="screen screen-settings" id="screenSettings">
            <div class="screen-header">
                <h1 class="large-title">Settings</h1>
            </div>
            <div class="settings-list" id="settingsList"></div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <nav class="tab-bar" role="tablist">
        <button type="button" class="tab" data-tab="today" role="tab">
            <span class="tab-icon" aria-hidden="true">📊</span>
            <span class="tab-label">Today</span>
        </button>
        <button type="button" class="tab" data-tab="plan" role="tab">
            <span class="tab-icon" aria-hidden="true">📅</span>
            <span class="tab-label">Plan</span>
        </button>
        <button type="button" class="tab" data-tab="chat" role="tab">
            <span class="tab-icon" aria-hidden="true">💬</span>
            <span class="tab-label">Chat</span>
        </button>
        <button type="button" class="tab" data-tab="grocery" role="tab">
            <span class="tab-icon" aria-hidden="true">🛒</span>
            <span class="tab-label">Grocery</span>
        </button>
        <button type="button" class="tab" data-tab="settings" role="tab">
            <span class="tab-icon" aria-hidden="true">⚙️</span>
            <span class="tab-label">Settings</span>
        </button>
    </nav>

    <!-- Recipe Sheet (content is built by openRecipeSheet) -->
    <div class="recipe-sheet" id="recipeSheet" role="dialog" aria-modal="true" aria-label="Recipe">
        <div class="recipe-sheet-backdrop" id="recipeSheetBackdrop"></div>
        <div class="recipe-sheet-content" id="recipeSheetContent"></div>
    </div>

    <!-- Generate Plan Sheet -->
    <div class="generate-sheet" id="generateSheet" role="dialog" aria-modal="true" aria-labelledby="generateTitle">
        <div class="sheet-backdrop" id="generateSheetBackdrop"></div>
        <div class="sheet-content">
            <div class="sheet-header">
                <h2 class="title" id="generateTitle">Generate Meal Plan</h2>
                <button type="button" class="btn-close" id="closeGenerateBtn" aria-label="Close">✕</button>
            </div>
            <div class="sheet-body">
                <div class="input-group">
                    <label class="label" for="inputLikes">Foods you like</label>
                    <input type="text" id="inputLikes" placeholder="e.g. chicken, pasta, avocado" autocomplete="off" enterkeyhint="next" />
                </div>

                <div class="input-group">
                    <label class="label" for="inputHates">Foods you avoid</label>
                    <input type="text" id="inputHates" placeholder="e.g. mushrooms, shellfish, dairy" autocomplete="off" enterkeyhint="done" />
                </div>

                <div class="input-group">
                    <div class="label">Your goal</div>
                    <div class="segment-buttons">
                        <button type="button" class="segment-btn" data-goal="Cut">Cut</button>
                        <button type="button" class="segment-btn" data-goal="Maintain">Maintain</button>
                        <button type="button" class="segment-btn" data-goal="Gain">Gain</button>
                    </div>
                </div>

                <div class="input-group">
                    <div class="label">Recipe source</div>
                    <div class="source-buttons">
                        <button type="button" class="source-btn" data-source="aiChef">AI Chef</button>
                        <button type="button" class="source-btn" data-source="themealdb">TheMealDB</button>
                        <button type="button" class="source-btn" data-source="spoonacular">Spoonacular</button>
                    </div>
                </div>

                <p class="sheet-hint">Also uses your profile: calories, diet, allergies, cooking time and more.
                    <button type="button" class="link-btn" id="editProfileBtn">Edit profile</button></p>

                <button type="button" class="btn btn-primary" id="generateBtn">Generate Plan</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

    <script src="json-repair.js"></script>
    <script src="app.js"></script>
</body>
</html>
