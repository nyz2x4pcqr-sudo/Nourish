# Settings → Appearance: contrast, coloured amounts, spacing, corners and a light theme; then back
# to the default dark look.
appId: io.github.nourish.app
---
- launchApp
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
- tapOn: "Appearance.*"
- extendedWaitUntil:
    visible: "Ember.*"
    timeout: 10000
- takeScreenshot: 09-appearance
- scrollUntilVisible:
    element: "Increase contrast.*"
    direction: DOWN
- tapOn: "Increase contrast.*"
- scrollUntilVisible:
    element: "Coloured amounts.*"
    direction: DOWN
- tapOn: "Coloured amounts.*"
- scrollUntilVisible:
    element: "Roomy"
    direction: DOWN
- tapOn: "Roomy"
- scrollUntilVisible:
    element: "Square"
    direction: DOWN
- tapOn: "Square"
- takeScreenshot: 09-options-set
- scrollUntilVisible:
    element: "Paper.*"
    direction: UP
- tapOn: "Paper.*"
- takeScreenshot: 09-paper-theme
- tapOn:
    text: "Today"
    retryTapIfNoChange: true
- takeScreenshot: 09-today-paper-roomy-square
# Back to the defaults.
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
- tapOn: "Appearance.*"
- scrollUntilVisible:
    element: "Ember.*"
    direction: DOWN
- tapOn: "Ember.*"
- scrollUntilVisible:
    element: "Increase contrast.*"
    direction: DOWN
- tapOn: "Increase contrast.*"
- scrollUntilVisible:
    element: "Coloured amounts.*"
    direction: DOWN
- tapOn: "Coloured amounts.*"
- scrollUntilVisible:
    element: "Comfortable"
    direction: DOWN
- tapOn: "Comfortable"
- scrollUntilVisible:
    element: "Round"
    direction: DOWN
- tapOn: "Round"
- tapOn:
    text: "Today"
    retryTapIfNoChange: true
- takeScreenshot: 09-today-default
