# Settings → Appearance: contrast, coloured amounts, spacing, corners and a light theme; then back
# to the default dark look.
appId: io.github.nourish.app
---
- launchApp
- repeat:
    times: 3
    while:
      notVisible: "Appearance.*"
    commands:
      - tapOn: "Settings"
- tapOn: "Appearance.*"
- extendedWaitUntil:
    visible: "Ember.*"
    timeout: 10000
- takeScreenshot: 09-appearance
- scrollUntilVisible:
    element: "Increase contrast.*"
    direction: DOWN
    centerElement: true
- tapOn: "Increase contrast.*"
- scrollUntilVisible:
    element: "Coloured amounts.*"
    direction: DOWN
    centerElement: true
- tapOn: "Coloured amounts.*"
# 0.1.17: recipe photos can be switched off (nothing is downloaded) and back on.
- scrollUntilVisible:
    element: "Recipe photos.*"
    direction: DOWN
    centerElement: true
- tapOn: "Recipe photos.*"
- tapOn: "Recipe photos.*"
- scrollUntilVisible:
    element: "Roomy"
    direction: DOWN
    centerElement: true
- tapOn: "Roomy"
- scrollUntilVisible:
    element: "Square"
    direction: DOWN
    centerElement: true
- tapOn: "Square"
- takeScreenshot: 09-options-set
# The Paper theme, by its note: an app icon is also called "Paper", and switching the app icon
# closes the app on Android.
- scrollUntilVisible:
    element: ".*Warm light.*"
    direction: UP
    centerElement: true
- tapOn: ".*Warm light.*"
- takeScreenshot: 09-paper-theme
- repeat:
    times: 3
    while:
      notVisible: "Today's meals.*|Generate Meal Plan"
    commands:
      - tapOn: "Today"
- takeScreenshot: 09-today-paper-roomy-square
# Back to the defaults.
- repeat:
    times: 3
    while:
      notVisible: "Appearance.*"
    commands:
      - tapOn: "Settings"
- tapOn: "Appearance.*"
- scrollUntilVisible:
    element: "Ember.*"
    direction: DOWN
    centerElement: true
- tapOn: "Ember.*"
- scrollUntilVisible:
    element: "Increase contrast.*"
    direction: DOWN
    centerElement: true
- tapOn: "Increase contrast.*"
- scrollUntilVisible:
    element: "Coloured amounts.*"
    direction: DOWN
    centerElement: true
- tapOn: "Coloured amounts.*"
- scrollUntilVisible:
    element: "Comfortable"
    direction: DOWN
    centerElement: true
- tapOn: "Comfortable"
- scrollUntilVisible:
    element: "Round"
    direction: DOWN
    centerElement: true
- tapOn: "Round"
- repeat:
    times: 3
    while:
      notVisible: "Today's meals.*|Generate Meal Plan"
    commands:
      - tapOn: "Today"
- takeScreenshot: 09-today-default
