# The shopping list folds pantry staples away; the pantry list is in Settings → Grocery list.
appId: io.github.nourish.app
---
- launchApp
- tapOn:
    text: "Grocery"
    retryTapIfNoChange: true
- takeScreenshot: 08-grocery
# The last thing on the page, just above the tab bar: it can't be scrolled to the middle.
- scrollUntilVisible:
    element: "Already in your pantry.*"
    direction: DOWN
    timeout: 60000
- tapOn: "Already in your pantry.*"
- scrollUntilVisible:
    element: "Change what.s in your pantry"
    direction: DOWN
    centerElement: true
- takeScreenshot: 08-pantry-open
- tapOn: "Change what.s in your pantry"
- extendedWaitUntil:
    visible: "Keep pantry staples off the list.*"
    timeout: 10000
- takeScreenshot: 08-pantry-settings
- tapOn: "Settings"
