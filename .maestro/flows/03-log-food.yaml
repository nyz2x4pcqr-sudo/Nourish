# Logging a one-off snack and a food that repeats every day.
appId: io.github.nourish.app
---
- launchApp
- repeat:
    times: 3
    while:
      notVisible: "Today's meals.*|Generate Meal Plan"
    commands:
      - tapOn: "Today"
- scrollUntilVisible:
    element: "Add food.*"
    direction: DOWN
    centerElement: true
# The box is named by its label on Android and by its example text on iPhone.
- tapOn: "Add food.*"
- extendedWaitUntil:
    visible: '(?i)(what did you have\?|e\.g\. 2 slices of pizza and a coffee)'
    timeout: 10000
- takeScreenshot: 03-add-food
# A snack, once.
- tapOn: '(?i)(what did you have\?|e\.g\. 2 slices of pizza and a coffee)'
- inputText: "1 apple"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Add ·.*"
    timeout: 20000
- takeScreenshot: 03-apple-found
- scrollUntilVisible:
    element: "Add ·.*"
    direction: DOWN
- tapOn: "Add ·.*"
- scrollUntilVisible:
    element: ".*Apple.*"
    direction: DOWN
# A food that logs itself every day.
- scrollUntilVisible:
    element: "Add food.*"
    direction: UP
- tapOn: "Add food.*"
- tapOn: '(?i)(what did you have\?|e\.g\. 2 slices of pizza and a coffee)'
- inputText: "1 cup black coffee"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Log this by itself"
    timeout: 20000
# The repeat menu is named "Repeat <food>" on Android and shows "Off" on iPhone.
- tapOn: "Repeat .*|Off"
- tapOn: "Every day"
- takeScreenshot: 03-coffee-every-day
- scrollUntilVisible:
    element: "Add ·.*"
    direction: DOWN
- tapOn: "Add ·.*"
- scrollUntilVisible:
    element: ".*[Cc]offee.*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*Apple.*"
    direction: UP
- takeScreenshot: 03-today-with-snacks
