# A 7-day plan from real recipes (Nourish's own recipes fill any gaps). No AI: the phone has no
# model and can't reach LM Studio. Lunch is "Eating out" (My schedule), so it's left unplanned.
appId: io.github.nourish.app
---
- launchApp
- extendedWaitUntil:
    visible: "Generate Meal Plan"
    timeout: 30000
- tapOn:
    text: "Generate Meal Plan"
    retryTapIfNoChange: true
# The first plan asks how long each meal can take; lunch is eaten out.
- extendedWaitUntil:
    visible: "Quick question.*"
    timeout: 10000
- takeScreenshot: 02-schedule-question
- tapOn:
    text: "Eating out"
    index: 1
- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Foods you love|FOODS YOU LOVE"
    timeout: 10000
- tapOn: "Maintain"
- scrollUntilVisible:
    element: "Generate Plan"
    direction: DOWN
- assertVisible: ".*Lunch Eating out.*"
- takeScreenshot: 02-new-plan-sheet
- tapOn: "Generate Plan"
- takeScreenshot: 02-generating
- extendedWaitUntil:
    visible: "Today's meals.*"
    timeout: 300000
- takeScreenshot: 02-today-with-plan
- scrollUntilVisible:
    element: ".*kept for it.*"
    direction: DOWN
- assertVisible: ".*Eating out.*"
- takeScreenshot: 02-today-eating-out
