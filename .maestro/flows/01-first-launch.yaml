# First launch on a fresh phone: the welcome screen, dark by default, and the profile.
appId: io.github.nourish.app
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "A week of good food.*"
    timeout: 60000
- takeScreenshot: 01-welcome
- assertVisible: "Generate Meal Plan"
# Dark is the default look ("Ember", the warm dark theme).
- tapOn:
    text: "Settings"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Appearance.*"
    timeout: 15000
- assertVisible: "Appearance.*Ember.*"
- takeScreenshot: 01-settings
# The profile, as a new user would open it.
- tapOn: "Set up your profile.*"
- extendedWaitUntil:
    visible: "Your profile"
    timeout: 10000
- assertVisible: "Goal.*"
- takeScreenshot: 01-profile
# Rows with a long hint keep their control on screen (they were pushed off the right edge).
- scrollUntilVisible:
    element: "Count calories.*"
    direction: DOWN
- takeScreenshot: 01-profile-targets
- scrollUntilVisible:
    element: "Budget.*"
    direction: DOWN
- takeScreenshot: 01-profile-budget
- tapOn:
    text: "Today"
    retryTapIfNoChange: true
- assertVisible: "Generate Meal Plan"
