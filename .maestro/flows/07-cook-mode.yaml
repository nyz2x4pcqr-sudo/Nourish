# Cook mode: one step at a time, with what that step uses.
appId: io.github.nourish.app
---
- launchApp
- tapOn:
    text: "Today"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element: "(?i)dinner.*"
    direction: DOWN
- tapOn: "(?i)dinner.*"
- extendedWaitUntil:
    visible: "Ingredients.*"
    timeout: 10000
- takeScreenshot: 07-recipe
- scrollUntilVisible:
    element: "Cook mode"
    direction: DOWN
    timeout: 30000
- tapOn: "Cook mode"
- extendedWaitUntil:
    visible: "(?i)step 1 of.*"
    timeout: 10000
- assertVisible: "(?i)you need"
- takeScreenshot: 07-cook-step-1
- tapOn: "Next step"
- assertVisible: "(?i)step 2 of.*"
- takeScreenshot: 07-cook-step-2
- tapOn: "Leave cook mode"
- tapOn: "Close"
