# Cook mode: one step at a time, with what that step uses.
appId: io.github.nourish.app
---
- launchApp
- repeat:
    times: 3
    while:
      notVisible: "Today's meals.*|Generate Meal Plan"
    commands:
      - tapOn: "Today"
- scrollUntilVisible:
    element: "(?i)dinner.*"
    direction: DOWN
    centerElement: true
- tapOn: "(?i)dinner.*"
- extendedWaitUntil:
    visible: "(?i)dinner . today.*"
    timeout: 10000
- takeScreenshot: 07-recipe
- scrollUntilVisible:
    element: "Cook mode"
    direction: DOWN
    timeout: 30000
- tapOn: "Cook mode"
- extendedWaitUntil:
    visible: "(?i)step 1 of.*"
    timeout: 10000
- takeScreenshot: 07-cook-step-1
- tapOn: "Next step"
- assertVisible: "(?i)step 2 of.*"
- takeScreenshot: 07-cook-step-2
- tapOn: "Leave cook mode"
# The recipe comes back where it was left; its Close button is at the top.
- scrollUntilVisible:
    element: "Close"
    direction: UP
- tapOn: "Close"
