# Nourish phone UI tests (Maestro). They walk through the app like a person would, in this order,
# on one phone: each flow carries on from where the one before left off (only the first starts fresh).
#
# Run them all:   maestro test .maestro
#   Android emulator on a PC: tools/phone-ui-test.ps1 (one command, see the file)
#   iPhone simulator on GitHub: .github/workflows/phone-ui-tests.yml (Actions → Run workflow)
# The recipe import uses fixtures/test-oat-bowl.html, read from this repo on GitHub (a phone
# rightly refuses links to private addresses such as 127.0.0.1, so it can't be served locally).
flows:
  - "flows/*.yaml"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - 01-first-launch
    - 02-generate-plan
    - 03-log-food
    - 04-reopen-keeps-food
    - 05-weekly-budget
    - 06-import-and-cookbook
    - 07-cook-mode
    - 08-pantry
    - 09-appearance
