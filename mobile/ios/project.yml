# XcodeGen project description (the .xcodeproj is generated from this on the build machine).
# Before generating, the build copies the web app into webapp/ and builds Frameworks/llama.xcframework
# (see .github/workflows/build-mobile.yml).
name: Nourish
options:
  bundleIdPrefix: io.github.nourish
  deploymentTarget:
    iOS: "16.4"   # llama.cpp's iOS framework needs 16.4+
targets:
  Nourish:
    type: application
    platform: iOS
    sources:
      - path: Nourish
        excludes:
          - Info.plist
          - Nourish-Bridging-Header.h
      - path: ../shared/connect.html
        buildPhase: resources
      - path: ../shared/llm
      - path: webapp
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
        codeSign: false
      - sdk: Metal.framework
      - sdk: Accelerate.framework
      - sdk: Vision.framework
      - sdk: PDFKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nourish.app
        PRODUCT_NAME: Nourish
        MARKETING_VERSION: "0.1.14"
        CURRENT_PROJECT_VERSION: "23"
        INFOPLIST_FILE: Nourish/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Alternate home screen icons (Settings → Appearance → App icon).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Midnight AppIcon-Forest AppIcon-Plum AppIcon-Paper AppIcon-Oled"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Nourish/Nourish-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../shared/llm
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
