# XcodeGen project description (the .xcodeproj is generated from this on the build machine).
name: Nourish
options:
  bundleIdPrefix: io.github.nourish
  deploymentTarget:
    iOS: "15.0"
targets:
  Nourish:
    type: application
    platform: iOS
    sources:
      - path: Nourish
        excludes:
          - Info.plist
      - path: ../shared/connect.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nourish.app
        PRODUCT_NAME: Nourish
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: Nourish/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
