plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.nourish'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.nourish.app'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.6.0-pre-alpha'
        // Real phones are arm64; x86_64 is for the emulator used by the automated test.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static' }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Built-in copy of the web app (assets/webapp) and the shared "connect to your PC" page.
    sourceSets {
        main.assets.srcDirs += ["$buildDir/generated/webassets"]
    }
}

def repoRoot = rootProject.file('../..')
tasks.register('copyWebApp', Copy) {
    from(repoRoot) {
        include 'index.html', 'styles.css', 'app.js', 'ondevice.js', 'json-repair.js', 'grocery.js', 'units.js', 'recipes.js', 'importer.js', 'font-fraunces.woff2', 'font-figtree.woff2',
                'manifest.webmanifest', 'icon-192.png', 'icon-512.png', 'apple-touch-icon.png'
        into 'webapp'
    }
    from(rootProject.file('../shared')) { include 'connect.html' }
    into "$buildDir/generated/webassets"
}
preBuild.dependsOn copyWebApp
