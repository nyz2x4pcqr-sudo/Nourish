plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.nourish'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.nourish.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-pre-alpha'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The shared "connect to your PC" page is used by both the Android and iOS apps.
    sourceSets {
        main.assets.srcDirs += ['../../shared']
    }
}
